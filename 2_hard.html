<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery_Report_W44_FINAL.xlsx</title>
<!-- ตั้งใจออกแบบให้อ่านยาก: ใช้สำหรับกิจกรรมในห้องเรียน -->
<style>
  body { margin: 0; background: #fff; font-family: Calibri, 'Segoe UI', Arial, sans-serif; font-size: 11px; color: #222; }
  .titlebar { background: #217346; color: #fff; padding: 5px 10px; font-size: 12px; }
  .ribbon { background: #f3f3f3; border-bottom: 1px solid #d4d4d4; padding: 4px 10px; color: #444; display: flex; gap: 18px; flex-wrap: wrap; }
  .ribbon b { color: #217346; }
  .fx { display: flex; border-bottom: 1px solid #d4d4d4; font-size: 11px; }
  .fx .ref { width: 60px; border-right: 1px solid #d4d4d4; padding: 3px 6px; }
  .fx .f { padding: 3px 6px; color: #555; white-space: nowrap; overflow: hidden; }
  .sheet { overflow: auto; height: calc(100vh - 110px); }
  table { border-collapse: collapse; font-size: 10.5px; }
  th, td { border: 1px solid #e2e2e2; padding: 1px 5px; white-space: nowrap; height: 18px; }
  th { background: #f3f3f3; color: #666; font-weight: normal; position: sticky; top: 0; z-index: 1; }
  td.rh { background: #f3f3f3; color: #888; text-align: center; position: sticky; left: 0; }
  td.n { text-align: right; position: relative; }
  td.n span { position: relative; }
  td.n .db { position: absolute; left: 0; top: 2px; bottom: 2px; background: linear-gradient(90deg, #5a8ac6, #c5d6ee); opacity: 0.7; }
  .good { background: #c6efce; color: #006100; }
  .hdr { background: #ddebf7; font-weight: bold; }
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; background: #f3f3f3; border-top: 1px solid #d4d4d4; padding: 3px 10px; display: flex; gap: 2px; font-size: 11px; }
  .tabs span { padding: 2px 12px; border: 1px solid #d4d4d4; background: #e9e9e9; }
  .tabs span.on { background: #fff; color: #217346; border-bottom-color: #fff; font-weight: bold; }
  .floating { position: absolute; background: #fff; border: 1px solid #bbb; box-shadow: 1px 1px 3px rgba(0,0,0,.2); padding: 4px; }
</style>
</head>
<body>
<div class="titlebar">Delivery_Report_W44_FINAL.xlsx — Excel</div>
<div class="ribbon"><span><b>Home</b></span><span>Insert</span><span>Page Layout</span><span>Formulas</span><span>Data</span><span>Review</span><span>View</span></div>
<div class="fx"><div class="ref">B4</div><div class="f">=SUMIFS(Raw!$H:$H,Raw!$C:$C,$A4,Raw!$D:$D,B$3)</div></div>
<div class="sheet" id="sheet"></div>
<div class="tabs"><span class="on">Summary</span><span>Raw</span><span>Pivot1</span><span>Pivot1 (2)</span><span>Sheet3</span><span>lookup_zone</span></div>

<script>
  // ข้อมูลชุดเดียวกับ delivery_easy.html (24–30 ต.ค. 2026)
  const slots = ['0911', '1113', '1315', '1517', '1719', '1921'];
  const share = [0.12, 0.16, 0.18, 0.2, 0.2, 0.14];
  const zones = [
    ['Z01_PTW', 900, [4, 5, 5, 6, 8, 7]], ['Z02_BRK', 820, [5, 5, 6, 7, 9, 8]],
    ['Z03_STN', 860, [4, 6, 5, 7, 8, 9]], ['Z04_CJK', 780, [5, 4, 6, 6, 9, 8]],
    ['Z05_HKW', 640, [4, 5, 5, 6, 8, 7]], ['Z06_BKP', 520, [5, 6, 6, 9, 12, 15]],
    ['Z07_BNA', 380, [6, 7, 9, 18, 38, 46]], ['Z08_LKB', 300, [7, 8, 10, 22, 44, 52]],
  ];
  const days = ['2026-10-24', '2026-10-25', '2026-10-26', '2026-10-27', '2026-10-28', '2026-10-29', '2026-10-30'];
  const wiggle = [0.97, 1.04, 0.99, 1.02, 0.96, 1.03, 0.99];

  // จำนวนพัสดุที่ส่งช้า (เป็นชิ้น) แทน % ทำให้เขตใหญ่ดูแย่พอๆ กับเขตที่มีปัญหาจริง
  const rows = [];
  days.forEach((d, di) => zones.forEach(([code, daily, late]) => {
    const vol = share.map(s => Math.round(daily * s * wiggle[(di + code.length) % 7]));
    const lateN = vol.map((v, i) => Math.round(v * late[i] / 100 * wiggle[(di + i) % 7]));
    rows.push({ d, code, vol, lateN, tv: vol.reduce((a, b) => a + b, 0), tl: lateN.reduce((a, b) => a + b, 0) });
  }));
  const maxLate = Math.max(...rows.flatMap(r => r.lateN));
  const TV = rows.reduce((s, r) => s + r.tv, 0), TL = rows.reduce((s, r) => s + r.tl, 0);

  const cols = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M', 'N', 'O', 'P'];
  let r = 1;
  let html = '<table><tr><th></th>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr>';
  const line = (cells) => { html += `<tr><td class="rh">${r++}</td>${cells}${'<td></td>'.repeat(Math.max(0, 16 - (cells.match(/<td/g) || []).length))}</tr>`; };

  line(`<td class="hdr">SUMMARY W44</td><td></td><td>TTL_PCL</td><td class="n">${TV.toLocaleString()}</td><td>LATE_PCL</td><td class="n">${TL.toLocaleString()}</td><td>OT%</td><td class="n good">${(100 - TL / TV * 100).toFixed(2)}%</td><td>AVG_OT_7D</td><td class="n good">${(100 - TL / TV * 100).toFixed(2)}%</td><td>DRV</td><td class="n">96</td>`);
  line('');
  line('<td class="hdr">DATE</td><td class="hdr">ZONE_CD</td>' + slots.map(s => `<td class="hdr">LATE_${s}</td>`).join('') + '<td class="hdr">LATE_TTL</td><td class="hdr">PCL_TTL</td><td class="hdr">SVC_TYPE</td><td class="hdr">HUB</td>');
  rows.forEach(x => {
    line(`<td>${x.d}</td><td>${x.code}</td>` +
      x.lateN.map(n => `<td class="n"><div class="db" style="width:${n / maxLate * 100}%"></div><span>${n}</span></td>`).join('') +
      `<td class="n">${x.tl}</td><td class="n">${x.tv}</td><td>STD</td><td>${x.code < 'Z06' ? 'HUB_C' : 'HUB_E'}</td>`);
  });
  line('');
  line(`<td class="hdr">GRAND TTL</td><td></td>` + slots.map((s, i) => `<td class="n">${rows.reduce((a, x) => a + x.lateN[i], 0)}</td>`).join('') + `<td class="n">${TL}</td><td class="n">${TV}</td>`);
  html += '</table>';
  document.getElementById('sheet').innerHTML = html;

  // กราฟแปะลอยทับตาราง: pie จำนวนพัสดุช้าตามเขต
  (function () {
    const byZone = zones.map(([code]) => [code, rows.filter(x => x.code === code).reduce((a, x) => a + x.tl, 0)]);
    const tot = byZone.reduce((a, [, v]) => a + v, 0);
    const colors = ['#4472c4', '#ed7d31', '#a5a5a5', '#ffc000', '#5b9bd5', '#70ad47', '#264478', '#9e480e'];
    let a = -Math.PI / 2, s = '<svg width="190" height="150" viewBox="0 0 190 150"><text x="4" y="12" font-size="10" fill="#555">Late PCL by Zone (Count)</text>';
    byZone.forEach(([k, v], i) => {
      const b = a + v / tot * Math.PI * 2, large = b - a > Math.PI ? 1 : 0;
      s += `<path d="M70 80 L${70 + 55 * Math.cos(a)} ${80 + 40 * Math.sin(a)} A55 40 0 ${large} 1 ${70 + 55 * Math.cos(b)} ${80 + 40 * Math.sin(b)} Z" fill="${colors[i]}" stroke="#fff" stroke-width="0.5"/>`;
      s += `<rect x="135" y="${24 + i * 14}" width="8" height="8" fill="${colors[i]}"/><text x="146" y="${31 + i * 14}" font-size="8" fill="#555">${k.slice(4)}</text>`;
      a = b;
    });
    const box = document.createElement('div');
    box.className = 'floating';
    box.style.cssText = 'top:150px; right:40px;';
    box.innerHTML = s + '</svg>';
    document.body.appendChild(box);
  })();
</script>
</body>
</html>
